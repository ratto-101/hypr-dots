general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.92)
    font_family = Electroharmonix
    font_size = 84
    position = 0, 110
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 48
    outline_thickness = 1k
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.07)
    inner_color = rgba(20, 20, 25, 0.23)
    font_family = Electroharmonix
    font_color = rgb(220, 220, 220)
    fade_on_empty = true
    placeholder_text = whats the password huh??
    position = 0, -50
    halign = center
    valign = center
}

