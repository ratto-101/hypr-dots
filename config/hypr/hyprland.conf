# =============================================================================
# hyprland.conf — Standard Hyprland config (no HyprMod required)
# =============================================================================
# This is the primary config loaded by Hyprland. The .lua files in this
# directory are HyprMod-specific (CachyOS) and are ignored by standard
# Hyprland. You can safely delete them if you don't use HyprMod.
# =============================================================================

# --- Autostart ---
exec-once = dbus-update-activation-environment --systemd --all
exec-once = waybar
exec-once = swaync
exec-once = waypaper --restore
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# --- Variables (change these to match your preferred apps) ---
$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$browser = brave-origin
$editor = gnome-text-editor --new-window
$calculator = gnome-calculator
$menu = rofi -show drun

# --- Monitors (auto-detect — works on any display) ---
# To set a specific monitor, replace the line below, e.g.:
#   monitor=HDMI-A-1,1920x1080@100,0x0,1
monitor=,preferred,auto,1

# --- Input ---
input {
    kb_layout = us
    repeat_delay = 250
    repeat_rate = 60
    accel_profile = flat
}

# --- Touchpad gestures ---
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 4
}

# --- Decoration ---
decoration {
    rounding = 18
    active_opacity = 0.9
    inactive_opacity = 0.8
    fullscreen_opacity = 1.0
    blur {
        size = 5
        passes = 4
        special = true
    }
}

# --- General ---
general {
    gaps_in = 3
    gaps_out = 13
    border_size = 0
    extend_border_grab_area = 10
    resize_on_border = true
}

# --- Misc ---
misc {
    vrr = 0
}

# --- Animations ---
animation = global, 1, 3, quick
animation = windows, 1, 3, easy, slide
animation = workspaces, 1, 5, quick, slide
animation = specialWorkspaceIn, 1, 2, quick, slide top
animation = specialWorkspaceOut, 1, 2, quick, slide bottom

# ===================== Keybinds =====================

# --- Window management ---
bind = $mainMod, Escape, exec, hyprctl kill
bind = $mainMod, Q, killactive
bind = $mainMod ALT, Space, togglefloating
bind = $mainMod, D, fullscreen, 1
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, J, togglesplit

# Focus
twobind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d
bind = ALT, Tab, cyclenext
bind = $mainMod, Tab, exec, rofi -show window

# Move window
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Launchers ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, exec, $editor
bind = $mainMod, C, exec, $calculator
bind = $mainMod, W, exec, $browser
bind = $mainMod SHIFT, Escape, exec, $terminal -e btop
bind = $mainMod, X, exec, swaync-client -t -sw
bind = $mainMod, Space, exec, $menu
bind = $mainMod, Period, exec, rofi -modi emoji -show emoji
bind = $mainMod, L, exec, hyprlock
bind = $mainMod ALT, C, exec, wlogout
bind = $mainMod, R, exec, ~/.config/waybar/scripts/launch.sh
bind = CTRL ALT, Delete, exec, wlogout

# --- Hardware controls (locked = works during screen lock) ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86AudioPlay, exec, playerctl play-pause
bindel = , XF86AudioPause, exec, playerctl play-pause
bindel = , XF86AudioNext, exec, playerctl next
bindel = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- Screenshots ---
bind = $mainMod, P, exec, hyprpicker -a -n
bind = $mainMod SHIFT, X, exec, hyprshot -m region --freeze
bind = $mainMod, Print, exec, hyprshot -m window
bind = , Print, exec, hyprshot -m output

# --- Clipboard ---
bind = $mainMod, V, exec, ~/.local/bin/rofi-clipboard

# --- Notifications ---
bind = $mainMod, A, exec, swaync-client -t -sw
bind = $mainMod, N, exec, swaync-client -t -sw

# --- Workspaces ---
bind = $mainMod, S, togglespecialworkspace
bind = $mainMod SHIFT, S, movetoworkspace, special

# Workspace switching (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- Rice scripts ---
bind = $mainMod SHIFT, W, exec, ~/.local/bin/waybar-wallpaper
bind = $mainMod SHIFT, P, exec, ~/.local/bin/powerprofile
bind = $mainMod SHIFT, L, exec, ~/.local/bin/laptop-mode
bind = $mainMod SHIFT, M, exec, ~/.local/bin/rice-menu
bind = $mainMod SHIFT, Slash, exec, ~/.local/bin/keybinds-menu

# --- Source other configs ---
source = ~/.config/hypr/hyprlock.conf
source = ~/.config/hypr/xdph.conf
